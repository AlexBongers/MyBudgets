<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyBudgets">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>MyBudgets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="side-top drag"><div class="brand"><img src="icon-192.png" alt=""><span>MyBudgets</span></div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <section class="content">
    <header class="toolbar drag">
      <h1 id="title">Dashboard</h1>
      <div class="spacer"></div>
      <div class="monthpick nodrag" id="monthpick">
        <button class="icon-btn" id="prev" aria-label="Vorige maand" title="Vorige maand (⌘[)">‹</button>
        <button class="monthlabel" id="monthlabel" title="Naar laatste maand met data"></button>
        <button class="icon-btn" id="next" aria-label="Volgende maand" title="Volgende maand (⌘])">›</button>
      </div>
      <button class="btn nodrag" id="palettebtn" title="Zoeken en navigeren" aria-label="Zoeken en navigeren"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><kbd>⌘K</kbd></button>
      <button class="btn primary nodrag" id="importbtn">Importeren</button>
    </header>
    <main id="main"></main>
  </section>
  <nav class="tabbar" id="tabbar" aria-label="Hoofdnavigatie"></nav>
</div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>
<script src="lib.js"></script>
<script src="charts.js"></script>
<script src="views-main.js"></script>
<script src="views-plan.js"></script>
<script src="views-year.js"></script>
<script src="views-config.js"></script>
<script src="views-detail.js"></script>
<script src="views-actual.js"></script>
<script src="palette.js"></script>
<script src="app.js"></script>
</body>
</html>
